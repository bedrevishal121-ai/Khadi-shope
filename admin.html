
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sohala Khadi Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f0e3;color:#301616;margin:0;padding:20px}
main{max-width:900px;margin:auto}
h1{color:#641d1d}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 5px 20px #0001}
input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #c99b38;border-radius:6px;font:inherit}
button{background:#591c1c;color:#f4d48a;font-weight:bold;cursor:pointer}
button:hover{background:#812929}
textarea{min-height:110px}
.status{padding:10px;background:#f3e4c4;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>सोहळा खादी | Admin</h1>
<div class="card">
<h2>GitHub Settings</h2>
<input id="owner" placeholder="GitHub Username">
<input id="repo" placeholder="Repository name">
<input id="token" type="password" placeholder="GitHub Token">
<button onclick="loadData()">GitHub वरून Data Load</button>
<p class="status" id="status">Repository details भरा.</p>
</div>

<div class="card">
<h2>Announcement</h2>
<textarea id="announcement"></textarea>
<h2>Hero Title</h2>
<input id="heroTitle">
<h2>Hero Subtitle</h2>
<textarea id="heroSubtitle"></textarea>
<h2>Offers (प्रत्येक ओळ एक Offer)</h2>
<textarea id="offers"></textarea>
</div>

<div class="card">
<h2>Store Details</h2>
<input id="storeName" placeholder="Store name">
<input id="address" placeholder="Address">
<input id="hours" placeholder="Store hours">
<input id="phone" placeholder="Phone number">
<input id="phoneDisplay" placeholder="Display phone">
</div>

<div class="card">
<h2>Products (JSON)</h2>
<textarea id="products" style="min-height:350px"></textarea>
<p>Products चा JSON format कायम ठेव.</p>
</div>

<div class="card">
<h2>Reviews (JSON)</h2>
<textarea id="reviews" style="min-height:220px"></textarea>
<p>Reviews JSON format मध्ये edit कर.</p>
</div>

<div class="card">
<button onclick="saveData()">GitHub वर Save / Update</button>
</div>
</main>

<script>
let data,sha;

function status(t){
 document.getElementById("status").textContent=t;
}

function getConfig(){
 return {
 owner:document.getElementById("owner").value.trim(),
 repo:document.getElementById("repo").value.trim(),
 token:document.getElementById("token").value.trim()
 };
}

async function loadData(){
 const c=getConfig();
 if(!c.owner||!c.repo||!c.token){
  status("Username, Repository आणि Token भरा.");
  return;
 }
 status("Loading...");
 try{
  const url=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/data.json`;
  const res=await fetch(url,{
   headers:{
    Authorization:"Bearer "+c.token,
    Accept:"application/vnd.github+json"
   }
  });
  if(!res.ok)throw new Error(await res.text());
  const file=await res.json();
  sha=file.sha;
  data=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,"")))));
  populate();
  status("Data Load झाला. आता edit करू शकता.");
 }catch(e){
  status("Load error: "+e.message);
 }
}

function populate(){
 document.getElementById("announcement").value=data.announcement||"";
 document.getElementById("heroTitle").value=data.hero?.title||"";
 document.getElementById("heroSubtitle").value=data.hero?.subtitle||"";
 document.getElementById("offers").value=(data.offers||[]).join("\n");
 document.getElementById("storeName").value=data.store?.name||"";
 document.getElementById("address").value=data.store?.address||"";
 document.getElementById("hours").value=data.store?.hours||"";
 document.getElementById("phone").value=data.store?.phone||"";
 document.getElementById("phoneDisplay").value=data.store?.phoneDisplay||"";
 document.getElementById("products").value=JSON.stringify(data.products,null,2);
 document.getElementById("reviews").value=JSON.stringify(data.reviews,null,2);
}

function collect(){
 data.announcement=document.getElementById("announcement").value;
 data.hero={
  title:document.getElementById("heroTitle").value,
  subtitle:document.getElementById("heroSubtitle").value
 };
 data.offers=document.getElementById("offers").value.split("\n").filter(Boolean);
 data.store={
  name:document.getElementById("storeName").value,
  address:document.getElementById("address").value,
  hours:document.getElementById("hours").value,
  phone:document.getElementById("phone").value,
  phoneDisplay:document.getElementById("phoneDisplay").value
 };
 data.products=JSON.parse(document.getElementById("products").value);
 data.reviews=JSON.parse(document.getElementById("reviews").value);
 return data;
}

async function saveData(){
 const c=getConfig();
 if(!data||!sha){
  status("आधी Data Load करा.");
  return;
 }
 try{
  collect();
  const url=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/data.json`;
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const res=await fetch(url,{
   method:"PUT",
   headers:{
    Authorization:"Bearer "+c.token,
    Accept:"application/vnd.github+json",
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message:"Update Sohala Khadi website data",
    content:content,
    sha:sha
   })
  });
  if(!res.ok)throw new Error(await res.text());
  const result=await res.json();
  sha=result.content.sha;
  status("Save successful! GitHub वर data update झाला.");
 }catch(e){
  status("Save error: "+e.message);
 }
}
</script>
</body>
</html>
